<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>DNotes</title>

<style>
* { box-sizing: border-box; }

:root {
    --bg: #f8f9fd;
    --text: #202124;
    --toolbar: #e8ecf5;
    --keyboard-height: 0px;
}

body {
    margin: 0;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
}

header {
    height: 65px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 8px;
}

button {
    border: 0;
    background: transparent;
    cursor: pointer;
    color: #555;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.top-btn {
    width: 36px;
    height: 42px;
    font-size: 25px;
    flex-shrink: 0;
}

#title {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    font-size: 16px;
    font-weight: 600;
}

main {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px 20px 120px;
}

#editor {
    display: block;
    width: 100%;
    min-height: 100%;
    border: 0;
    outline: 0;
    resize: none;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 21px;
    line-height: 1.65;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

#editor::placeholder { color: #aaa; }

/* PREVIEW */

#preview {
    display: none;
    font-size: 20px;
    line-height: 1.65;
    overflow-wrap: anywhere;
}

#preview h1 { font-size: 1.7em; }
#preview h2 { font-size: 1.4em; }
#preview h3 { font-size: 1.15em; }

#preview pre {
    background: #e9edf4;
    padding: 14px;
    border-radius: 10px;
    overflow-x: auto;
}

#preview code {
    background: #e9edf4;
    padding: 3px 5px;
    border-radius: 4px;
}

#preview pre code { background: transparent; }

#preview blockquote {
    border-left: 3px solid #aab5c5;
    padding-left: 14px;
    color: #666;
}

#preview a { color: #356b9d; }

#preview table {
    border-collapse: collapse;
    width: 100%;
    margin: 12px 0;
    font-size: 16px;
}

#preview th,
#preview td {
    border: 1px solid #cbd2dc;
    padding: 9px;
    text-align: left;
}

/* TOOLBAR */

.toolbar {
    position: fixed;
    left: 4%;
    width: 92%;

    bottom: calc(
        var(--keyboard-height) +
        14px +
        env(safe-area-inset-bottom)
    );

    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 7px 5px;

    background: var(--toolbar);
    border-radius: 28px;
    box-shadow: 0 5px 14px #0002;

    z-index: 5;
    touch-action: none;
    user-select: none;
}

.tool {
    width: 43px;
    height: 48px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    font-size: 22px;
    font-weight: bold;
    color: #242830;
    flex-shrink: 1;
    touch-action: none;
}

.tool:active { background: #d4dce9; }

.italic {
    font-style: italic;
    font-family: Georgia, serif;
}

.tool svg {
    width: 24px;
    height: 24px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
}

/* MENU */

.menu {
    display: none;
    position: fixed;
    top: 60px;
    right: 14px;
    background: white;
    border-radius: 13px;
    padding: 8px;
    box-shadow: 0 5px 20px #0002;
    z-index: 10;
    min-width: 180px;
}

.menu button {
    display: block;
    width: 100%;
    padding: 12px;
    text-align: left;
}

.status {
    position: fixed;
    bottom: 95px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    color: #999;
    pointer-events: none;
}

/* TABLE PICKER */

.table-picker {
    display: none;
    position: fixed;
    z-index: 20;
    left: 50%;
    bottom: calc(
        var(--keyboard-height) +
        95px +
        env(safe-area-inset-bottom)
    );
    transform: translateX(-50%);
    width: min(340px, 92vw);
    padding: 15px;
    background: white;
    border-radius: 17px;
    box-shadow: 0 6px 25px #0003;
    touch-action: none;
}

.picker-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    font-size: 14px;
    font-weight: 600;
}

.picker-close {
    font-size: 22px;
    width: 30px;
    height: 30px;
}

.table-grid {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 4px;
    touch-action: none;
    user-select: none;
}

.grid-cell {
    aspect-ratio: 1;
    border: 1px solid #cbd2dc;
    border-radius: 4px;
    background: #f6f7fa;
}

.grid-cell.selected {
    background: #8caedb;
    border-color: #527eaf;
}

.grid-cell:active {
    background: #739bcf;
}

.picker-size {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    margin-top: 14px;
}

.picker-size input {
    width: 55px;
    height: 36px;
    text-align: center;
    border: 1px solid #ccd3de;
    border-radius: 7px;
    font-size: 15px;
    outline: none;
}

.picker-size span {
    color: #666;
    font-size: 14px;
}

.picker-actions {
    display: flex;
    gap: 9px;
    margin-top: 13px;
}

.picker-actions button {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    background: #e8ecf5;
    font-weight: 600;
}

.picker-actions .insert-table {
    background: #527eaf;
    color: white;
}

@media(min-width:700px) {
    main {
        max-width: 850px;
        width: 100%;
        margin: auto;
    }

    .toolbar {
        width: min(620px,75%);
        left: 50%;
        transform: translateX(-50%);
    }
}
</style>
</head>

<body>

<header>
    <button class="top-btn" id="backBtn">‹</button>
    <input id="title" value="Untitled note">
    <button class="top-btn" id="previewBtn">◉</button>
    <button class="top-btn" id="undoBtn">↶</button>
    <button class="top-btn" id="redoBtn">↷</button>
    <button class="top-btn" id="saveBtn">✓</button>
    <button class="top-btn" id="menuBtn">⋮</button>
</header>

<main>
    <textarea
        id="editor"
        placeholder="Start writing Markdown..."
        spellcheck="false"
    ></textarea>

    <article id="preview"></article>
</main>

<!-- TOOLBAR -->

<div class="toolbar" id="toolbar">

    <button class="tool" data-action="bold">B</button>
    <button class="tool italic" data-action="italic">I</button>
    <button class="tool" data-action="strike">S̶</button>
    <button class="tool" data-action="heading">T</button>
    <button class="tool" data-action="code">&lt;&gt;</button>
    <button class="tool" data-action="codeblock">{ }</button>

    <button class="tool" data-action="link">
        <svg viewBox="0 0 24 24">
            <path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-2 2"/>
            <path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l2-2"/>
        </svg>
    </button>

    <!-- TABLE BUTTON -->

    <button class="tool" data-action="table" aria-label="Insert table">
        ▦
    </button>

</div>

<!-- TABLE PICKER -->

<div class="table-picker" id="tablePicker">

    <div class="picker-header">
        <span>Select table size</span>
        <button class="picker-close" id="closePicker">×</button>
    </div>

    <div class="table-grid" id="tableGrid"></div>

    <div class="picker-size">
        <input type="number" id="tableRows" min="1" max="9" value="3">
        <span>Rows ×</span>
        <input type="number" id="tableCols" min="1" max="9" value="3">
        <span>Columns</span>
    </div>

    <div class="picker-actions">
        <button id="cancelTable">Cancel</button>
        <button class="insert-table" id="insertTable">Insert Table</button>
    </div>

</div>

<div class="menu" id="menu">
    <button data-menu="new">New Note</button>
    <button data-menu="md">Download Markdown</button>
    <button data-menu="html">Download HTML</button>
    <button data-menu="clear">Clear Note</button>
</div>

<script>
const editor = document.getElementById("editor");
const title = document.getElementById("title");
const preview = document.getElementById("preview");
const toolbar = document.getElementById("toolbar");
const menu = document.getElementById("menu");

const tablePicker = document.getElementById("tablePicker");
const tableGrid = document.getElementById("tableGrid");
const tableRows = document.getElementById("tableRows");
const tableCols = document.getElementById("tableCols");

let previewMode = false;


/* SAVE */

function save() {
    localStorage.setItem("markdown-note", JSON.stringify({
        title: title.value,
        content: editor.value
    }));
    showStatus("Saved");
}


/* RESTORE */

function restore() {
    try {
        const data = JSON.parse(
            localStorage.getItem("markdown-note") || "null"
        );

        if (data) {
            title.value = data.title || "Untitled note";
            editor.value = data.content || "";
        }
    } catch(e) {}
}

restore();


/* STATUS */

let statusTimer;

function showStatus(message) {
    let el = document.querySelector(".status");

    if (!el) {
        el = document.createElement("div");
        el.className = "status";
        document.body.appendChild(el);
    }

    el.textContent = message;
    clearTimeout(statusTimer);

    statusTimer = setTimeout(() => {
        el.textContent = "";
    }, 1300);
}


/* AUTO SAVE */

let saveTimer;

function autoSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 350);
}

editor.addEventListener("input", autoSave);
title.addEventListener("input", autoSave);


/* CARET MEMORY */

let savedStart = 0;
let savedEnd = 0;

function rememberSelection() {
    savedStart = editor.selectionStart;
    savedEnd = editor.selectionEnd;
}

editor.addEventListener("select", rememberSelection);
editor.addEventListener("keyup", rememberSelection);
editor.addEventListener("click", rememberSelection);
editor.addEventListener("input", rememberSelection);
editor.addEventListener("focus", rememberSelection);


/* GET CURRENT SELECTION */

function getSelection() {
    if (document.activeElement === editor) {
        rememberSelection();
    }

    return {
        start: savedStart,
        end: savedEnd
    };
}


/* INSERT AND SET CURSOR */

function insertAt(start, end, text, cursor) {
    editor.setRangeText(text, start, end, "preserve");
    editor.setSelectionRange(cursor, cursor);

    savedStart = cursor;
    savedEnd = cursor;

    autoSave();
}


/* FORMAT MARKERS */

function clickFormat(type) {

    const markers = {
        bold: ["**", "**"],
        italic: ["*", "*"],
        strike: ["~~", "~~"]
    };

    const [before, after] = markers[type];

    const {start, end} = getSelection();
    const value = editor.value;

    editor.focus();

    /* SELECTED TEXT */

    if (start !== end) {

        const selected = value.slice(start, end);

        const left = value.slice(start - before.length, start);
        const right = value.slice(end, end + after.length);

        if (left === before && right === after) {

            editor.setRangeText(
                selected,
                start - before.length,
                end + after.length,
                "select"
            );

            savedStart = start - before.length;
            savedEnd = savedStart + selected.length;

        } else {

            editor.setRangeText(
                before + selected + after,
                start,
                end,
                "select"
            );

            savedStart = start + before.length;
            savedEnd = savedStart + selected.length;
        }

        editor.setSelectionRange(savedStart, savedEnd);
        autoSave();
        return;
    }


    /* EMPTY MARKERS */

    if (
        value.slice(start - before.length, start) === before &&
        value.slice(start, start + after.length) === after
    ) {

        insertAt(
            start - before.length,
            start + after.length,
            "",
            start - before.length
        );

        return;
    }


    /*
       If line has a heading prefix,
       keep formatting after the heading prefix.
    */

    const lineStart = value.lastIndexOf("\n", start - 1) + 1;
    const lineBeforeCursor = value.slice(lineStart, start);

    const headingMatch = lineBeforeCursor.match(/^#{1,3} /);

    let position = start;

    if (headingMatch) {
        position = Math.max(
            start,
            lineStart + headingMatch[0].length
        );
    }

    insertAt(
        position,
        position,
        before + after,
        position + before.length
    );
}


/* SWIPE UP FORMATTING */

function swipeFormat(type) {

    const markers = {
        bold: ["**", "**"],
        italic: ["*", "*"],
        strike: ["~~", "~~"]
    };

    const [before, after] = markers[type];

    const {start: cursor} = getSelection();

    const value = editor.value;

    const lineStart = value.lastIndexOf("\n", cursor - 1) + 1;

    let lineEnd = value.indexOf("\n", cursor);
    if (lineEnd === -1) lineEnd = value.length;

    const line = value.slice(lineStart, lineEnd);

    if (!line.trim()) return;

    /*
       Preserve heading prefix.
       Format only content after "# ".
    */

    const match = line.match(/^(#{1,3} )/);

    const prefix = match ? match[0] : "";
    const content = line.slice(prefix.length);

    if (!content.trim()) return;

    let result;

    if (
        content.startsWith(before) &&
        content.endsWith(after) &&
        content.length > before.length + after.length
    ) {
        result = content.slice(before.length, -after.length);
    } else {
        result = before + content + after;
    }

    const newLine = prefix + result;

    editor.setRangeText(
        newLine,
        lineStart,
        lineEnd,
        "preserve"
    );

    const newCursor = cursor + newLine.length - line.length;

    savedStart = savedEnd = newCursor;
    editor.setSelectionRange(newCursor, newCursor);

    autoSave();
}


/* HEADING CYCLING */

function heading() {

    const {start: cursor} = getSelection();

    const value = editor.value;

    const lineStart = value.lastIndexOf("\n", cursor - 1) + 1;

    let lineEnd = value.indexOf("\n", cursor);
    if (lineEnd === -1) lineEnd = value.length;

    const line = value.slice(lineStart, lineEnd);

    const match = line.match(/^(#{1,3}) /);

    let level = match ? match[1].length : 0;

    const content = match
        ? line.slice(match[0].length)
        : line;

    level = (level + 1) % 4;

    const prefix = level ? "#".repeat(level) + " " : "";

    const result = prefix + content;

    /*
       Heading is always inserted at the
       absolute beginning of the line.
    */

    const oldPrefixLength = match ? match[0].length : 0;

    const relativePosition = Math.max(
        0,
        cursor - lineStart - oldPrefixLength
    );

    const newCursor = lineStart + prefix.length + relativePosition;

    editor.setRangeText(
        result,
        lineStart,
        lineEnd,
        "preserve"
    );

    savedStart = savedEnd = Math.min(
        newCursor,
        lineStart + result.length
    );

    editor.setSelectionRange(savedStart, savedEnd);

    autoSave();
}


/* INLINE CODE */

function code() {

    const {start, end} = getSelection();

    const selected = editor.value.slice(start, end);

    editor.focus();

    if (start === end) {
        insertAt(start, end, "``", start + 1);
    } else {
        editor.setRangeText(
            "`" + selected + "`",
            start,
            end,
            "select"
        );

        savedStart = start + 1;
        savedEnd = savedStart + selected.length;

        editor.setSelectionRange(savedStart, savedEnd);
        autoSave();
    }
}


/* CODE BLOCK */

function codeBlock() {

    const {start, end} = getSelection();

    const selected = editor.value.slice(start, end);

    editor.focus();

    const text = "```\n" + selected + "\n```";

    editor.setRangeText(text, start, end, "select");

    savedStart = start + 4;
    savedEnd = savedStart + selected.length;

    editor.setSelectionRange(savedStart, savedEnd);

    autoSave();
}


/* LINK */

function insertLink() {

    const {start, end} = getSelection();

    const selected = editor.value.slice(start, end);

    const url = prompt("Enter URL:");

    if (!url) return;

    editor.focus();

    const text = "[" + (selected || "Link text") + "](" + url + ")";

    editor.setRangeText(text, start, end, "select");

    autoSave();
}


/* TABLE INSERTION */

function createTable(rows, cols) {

    rows = Math.max(1, Math.min(9, rows));
    cols = Math.max(1, Math.min(9, cols));

    const header = [];
    const separator = [];
    const body = [];

    for (let c = 1; c <= cols; c++) {
        header.push("Column " + c);
        separator.push("---");
    }

    for (let r = 0; r < rows; r++) {
        body.push(
            "| " + Array(cols).fill("").join(" | ") + " |"
        );
    }

    const table =
        "| " + header.join(" | ") + " |\n" +
        "| " + separator.join(" | ") + " |\n" +
        body.join("\n");

    const {start, end} = getSelection();

    editor.focus();

    const prefix = start > 0 && editor.value[start - 1] !== "\n"
        ? "\n"
        : "";

    const suffix = end < editor.value.length &&
        editor.value[end] !== "\n"
        ? "\n"
        : "";

    const insertion = prefix + table + suffix;

    editor.setRangeText(
        insertion,
        start,
        end,
        "end"
    );

    rememberSelection();
    autoSave();

    closeTablePicker();
}


/* TABLE PICKER GRID */

let selectedRows = 3;
let selectedCols = 3;
let selectingGrid = false;
let gridPointerId = null;

function buildGrid() {

    tableGrid.innerHTML = "";

    for (let r = 1; r <= 9; r++) {

        for (let c = 1; c <= 9; c++) {

            const cell = document.createElement("div");

            cell.className = "grid-cell";
            cell.dataset.row = r;
            cell.dataset.col = c;

            tableGrid.appendChild(cell);
        }
    }

    updateGrid();
}


/* UPDATE GRID */

function updateGrid() {

    tableRows.value = selectedRows;
    tableCols.value = selectedCols;

    tableGrid.querySelectorAll(".grid-cell").forEach(cell => {

        const row = Number(cell.dataset.row);
        const col = Number(cell.dataset.col);

        cell.classList.toggle(
            "selected",
            row <= selectedRows && col <= selectedCols
        );

    });
}


/* SELECT GRID CELL */

function selectGridCell(cell) {

    if (!cell) return;

    selectedRows = Number(cell.dataset.row);
    selectedCols = Number(cell.dataset.col);

    updateGrid();
}


/* GRID POINTER EVENTS */

tableGrid.addEventListener("pointerdown", e => {

    const cell = e.target.closest(".grid-cell");

    if (!cell) return;

    e.preventDefault();

    selectingGrid = true;
    gridPointerId = e.pointerId;

    tableGrid.setPointerCapture(e.pointerId);

    selectGridCell(cell);

});

tableGrid.addEventListener("pointermove", e => {

    if (!selectingGrid || e.pointerId !== gridPointerId) return;

    const element = document.elementFromPoint(e.clientX, e.clientY);

    const cell = element?.closest(".grid-cell");

    if (cell && tableGrid.contains(cell)) {
        selectGridCell(cell);
    }

});

function stopGridSelection(e) {

    if (e.pointerId !== gridPointerId) return;

    selectingGrid = false;
    gridPointerId = null;
}

tableGrid.addEventListener("pointerup", stopGridSelection);
tableGrid.addEventListener("pointercancel", stopGridSelection);


/* INPUT AND GRID SYNC */

function updateFromInputs() {

    selectedRows = Math.max(
        1,
        Math.min(9, Number(tableRows.value) || 1)
    );

    selectedCols = Math.max(
        1,
        Math.min(9, Number(tableCols.value) || 1)
    );

    updateGrid();
}

tableRows.addEventListener("input", updateFromInputs);
tableCols.addEventListener("input", updateFromInputs);


/* OPEN PICKER */

function openTablePicker() {

    selectedRows = 3;
    selectedCols = 3;

    updateGrid();

    tablePicker.style.display = "block";
}


/* CLOSE PICKER */

function closeTablePicker() {
    tablePicker.style.display = "none";
}

document.getElementById("closePicker").onclick = closeTablePicker;
document.getElementById("cancelTable").onclick = closeTablePicker;

document.getElementById("insertTable").onclick = () => {
    createTable(selectedRows, selectedCols);
};


/* UNDO REDO */

function undo() {
    editor.focus();
    document.execCommand("undo");
    rememberSelection();
    autoSave();
}

function redo() {
    editor.focus();
    document.execCommand("redo");
    rememberSelection();
    autoSave();
}


/* MARKDOWN RENDERER */

function escapeHTML(text) {
    return text.replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[c]);
}


function renderMarkdown(source) {

    let text = escapeHTML(source);

    const blocks = [];

    /* CODE BLOCKS */

    text = text.replace(
        /```([^\n]*)\n([\s\S]*?)```/g,
        (match, language, code) => {

            const id = blocks.length;

            blocks.push(
                "<pre><code>" + code + "</code></pre>"
            );

            return "%%BLOCK" + id + "%%";
        }
    );


    /* TABLES */

    const lines = text.split("\n");
    const output = [];

    for (let i = 0; i < lines.length; i++) {

        if (
            lines[i].trim().startsWith("|") &&
            i + 1 < lines.length &&
            /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1])
        ) {

            const headers = lines[i]
                .split("|")
                .slice(1, -1);

            i++;

            let html = "<table><thead><tr>";

            headers.forEach(h => {
                html += "<th>" + h.trim() + "</th>";
            });

            html += "</tr></thead><tbody>";

            while (
                i + 1 < lines.length &&
                lines[i + 1].trim().startsWith("|")
            ) {

                i++;

                const cells = lines[i]
                    .split("|")
                    .slice(1, -1);

                html += "<tr>";

                cells.forEach(c => {
                    html += "<td>" + c.trim() + "</td>";
                });

                html += "</tr>";
            }

            html += "</tbody></table>";

            output.push(html);

        } else {

            output.push(lines[i]);

        }
    }

    text = output.join("\n");


    /* INLINE CODE */

    text = text.replace(
        /`([^`]+)`/g,
        "<code>$1</code>"
    );

    /* LINKS */

    text = text.replace(
        /\[([^\]]+)\]\((https?:\/\/[^ )]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener">$1</a>'
    );

    /* BOLD */

    text = text.replace(
        /\*\*(.+?)\*\*/g,
        "<strong>$1</strong>"
    );

    /* ITALIC */

    text = text.replace(
        /(?<!\*)\*([^*\n]+)\*(?!\*)/g,
        "<em>$1</em>"
    );

    /* STRIKE */

    text = text.replace(
        /~~(.+?)~~/g,
        "<del>$1</del>"
    );

    /* HEADINGS */

    text = text.replace(/^### (.*)$/gm, "<h3>$1</h3>");
    text = text.replace(/^## (.*)$/gm, "<h2>$1</h2>");
    text = text.replace(/^# (.*)$/gm, "<h1>$1</h1>");

    /* BLOCKQUOTE */

    text = text.replace(
        /^&gt; (.*)$/gm,
        "<blockquote>$1</blockquote>"
    );

    text = text.replace(/^---+$/gm, "<hr>");

    text = text.replace(/\n/g, "<br>");

    text = text.replace(
        /%%BLOCK(\d+)%%/g,
        (match, id) => blocks[id]
    );

    return text;
}


/* PREVIEW */

function togglePreview() {

    if (!previewMode) {

        closeTablePicker();

        preview.innerHTML = renderMarkdown(editor.value);

        previewMode = true;

        editor.blur();

        editor.style.display = "none";
        preview.style.display = "block";
        toolbar.style.display = "none";

        showStatus("Preview");

    } else {

        openEditor();
    }
}


/* BACK TO EDIT */

function openEditor() {

    previewMode = false;

    preview.style.display = "none";
    editor.style.display = "block";
    toolbar.style.display = "flex";

    showStatus("Editing");
}

preview.addEventListener("click", e => {

    if (e.target.closest("a")) return;

    openEditor();
});


/* KEYBOARD-AWARE TOOLBAR */

const visual = window.visualViewport;

function updateToolbarPosition() {

    if (!visual) return;

    const keyboardOpen =
        document.activeElement === editor;

    const height = keyboardOpen
        ? Math.max(
            0,
            window.innerHeight -
            visual.height -
            visual.offsetTop
        )
        : 0;

    document.documentElement.style.setProperty(
        "--keyboard-height",
        height + "px"
    );
}

editor.addEventListener("focus", updateToolbarPosition);

editor.addEventListener("blur", () => {
    setTimeout(updateToolbarPosition, 100);
});

if (visual) {
    visual.addEventListener("resize", updateToolbarPosition);
    visual.addEventListener("scroll", updateToolbarPosition);
}

window.addEventListener("resize", updateToolbarPosition);


/* TOOLBAR GESTURES */

let gesture = null;

const LONG_PRESS = 300;
const DOWN_DISTANCE = 50;
const UP_DISTANCE = 35;

toolbar.addEventListener("contextmenu", e => {
    e.preventDefault();
});

toolbar.addEventListener("pointerdown", e => {

    if (e.pointerType === "mouse") return;

    const button = e.target.closest(".tool");

    if (!button) return;

    e.preventDefault();

    gesture = {
        id: e.pointerId,
        x: e.clientX,
        y: e.clientY,
        time: Date.now(),
        action: button.dataset.action
    };

    try {
        toolbar.setPointerCapture(e.pointerId);
    } catch(err) {}

});


toolbar.addEventListener("pointerup", e => {

    if (!gesture || gesture.id !== e.pointerId) return;

    const g = gesture;
    gesture = null;

    const dx = Math.abs(e.clientX - g.x);
    const dy = e.clientY - g.y;
    const duration = Date.now() - g.time;

    if (dx > 65) return;


    /* LONG PRESS + DOWN SWIPE = PREVIEW */

    if (
        duration >= LONG_PRESS &&
        dy >= DOWN_DISTANCE
    ) {

        editor.blur();

        if (!previewMode) togglePreview();

        return;
    }


    /* SWIPE UP = LINE FORMATTING OR TABLE PICKER */

    if (dy <= -UP_DISTANCE) {

        if (
            ["bold", "italic", "strike"].includes(g.action)
        ) {
            swipeFormat(g.action);
            return;
        }

        if (g.action === "table") {
            openTablePicker();
            return;
        }
    }


    /* NORMAL TAP */

    if (
        duration < LONG_PRESS &&
        Math.abs(dy) < 15
    ) {

        switch (g.action) {

            case "bold":
            case "italic":
            case "strike":
                clickFormat(g.action);
                break;

            case "heading":
                heading();
                break;

            case "code":
                code();
                break;

            case "codeblock":
                codeBlock();
                break;

            case "link":
                insertLink();
                break;

            case "table":
                createTable(2, 2);
                break;
        }
    }

});

toolbar.addEventListener("pointercancel", () => {
    gesture = null;
});


/* MENU */

function toggleMenu() {
    menu.style.display =
        menu.style.display === "block"
        ? "none"
        : "block";
}

document.getElementById("menuBtn").onclick = toggleMenu;

document.addEventListener("click", e => {

    if (
        !menu.contains(e.target) &&
        e.target.id !== "menuBtn"
    ) {
        menu.style.display = "none";
    }
});


/* HEADER BUTTONS */

document.getElementById("previewBtn").onclick = togglePreview;
document.getElementById("undoBtn").onclick = undo;
document.getElementById("redoBtn").onclick = redo;
document.getElementById("saveBtn").onclick = save;

document.getElementById("backBtn").onclick = () => {
    if (previewMode) openEditor();
    else newNote();
};


/* NEW NOTE */

function newNote() {

    if (!confirm("Start a new note?")) return;

    editor.value = "";
    title.value = "Untitled note";

    if (previewMode) openEditor();

    save();
}


/* CLEAR */

function clearNote() {

    if (!confirm("Clear this note?")) return;

    editor.value = "";

    savedStart = savedEnd = 0;

    autoSave();
}


/* DOWNLOAD */

function download(filename, content, type) {

    const blob = new Blob(
        [content],
        {type: type}
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;
    a.download = filename;

    a.click();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
}


function downloadMD() {

    download(
        (title.value || "note") + ".md",
        editor.value,
        "text/markdown;charset=utf-8"
    );
}


function downloadHTML() {

    const html = `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>${escapeHTML(title.value)}</title>
</head>
<body>
${renderMarkdown(editor.value)}
</body>
</html>`;

    download(
        (title.value || "note") + ".html",
        html,
        "text/html;charset=utf-8"
    );
}


/* MENU ACTIONS */

menu.addEventListener("click", e => {

    const action = e.target.dataset.menu;

    if (!action) return;

    menu.style.display = "none";

    if (action === "new") newNote();
    if (action === "clear") clearNote();
    if (action === "md") downloadMD();
    if (action === "html") downloadHTML();
});


/* INITIALIZE */

buildGrid();
updateToolbarPosition();

</script>

</body>
</html>
